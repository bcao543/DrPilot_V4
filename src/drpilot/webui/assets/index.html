<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrPilot v4 · ADB 题目识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>𝘿𝙧𝙋𝙞𝙡𝙤𝙩 <span>𝙑𝟰</span></h1>
      <p>ADB 截图 · AI 题目识别 · 导出 JSONL / Markdown / index.json</p>
    </div>
    <div class="topbar-actions">
      <div class="pill" id="pill-device"><i class="dot"></i><span id="pill-device-text">设备：检测中…</span></div>
      <div class="pill" id="pill-model"><i class="dot"></i><span id="pill-model-text">模型：未测试</span></div>
      <button class="btn ghost" id="btn-exit">退出</button>
    </div>
  </header>

  <section class="card toolbar">
    <button class="btn primary" id="btn-start"><b>▶</b> 开始提取</button>
    <button class="btn danger" id="btn-stop" disabled><b>■</b> 停止</button>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="run-meta">
      <span class="cur" id="cur">--</span>
      <span class="status" id="status">就绪</span>
    </div>
    <div class="workers" id="worker-chips"></div>
  </section>

  <!-- 主页面只放「每次都要改」的三块；其余设置点入口卡片，在独立窗口里配 -->
  <div class="workspace">
    <main class="grid">
      <div class="col">
        <section class="card">
          <div class="card-head">
            <h2>任务范围</h2><span class="hint">题号以截图右上角为准</span>
          </div>
          <div class="rows">
            <div class="row">
              <label class="field"><span>题号</span>
                <input id="page_from" class="w-sm num" placeholder="起始">
              </label>
              <span class="tilde">到</span>
              <input id="page_to" class="w-sm num" placeholder="结束">
              <span class="badge" id="total-hint">共 — 题</span>
            </div>
            <div class="row">
              <label class="field grow"><span>教材</span><input id="textbook" placeholder="如：诊断学"></label>
              <label class="field grow"><span>章节</span><input id="chapter" placeholder="如：第三章 胸部检查"></label>
            </div>
            <div class="row">
              <label class="field"><span>章号</span><input id="chapter_no" class="w-xs num" placeholder="自动"></label>
              <label class="field"><span>本章总题数</span><input id="chapter_total" class="w-sm num" placeholder="自动"></label>
              <span class="hint">留空则自动识别</span>
            </div>
            <div class="row">
              <label class="field grow"><span>输出</span><input id="output_dir" placeholder="如：D:\\题库"></label>
              <button class="btn" id="btn-pick-dir">选择…</button>
            </div>
            <p class="preview" id="output-preview">请先选择输出文件夹</p>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>手机连接</h2><span class="hint">无线调试，一键 adb connect</span>
            <span class="spacer"></span>
            <button class="btn small" id="btn-refresh-devices">刷新设备</button>
          </div>
          <div class="rows">
            <div class="row">
              <label class="field grow"><span>手机 IP</span><input id="device_ip" placeholder="无线调试里的 IP"></label>
              <span class="colon">:</span>
              <input id="device_port" class="w-xs num" placeholder="5555">
            </div>
            <div class="row">
              <button class="btn primary" id="btn-connect"><b>⇄</b> 连接</button>
              <button class="btn" id="btn-disconnect">断开</button>
              <span class="hint" id="device-detail">未检测</span>
            </div>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="card-head">
            <h2>识别与输出</h2><span class="hint">批大小 / 并发 / 等待 / 产物开关</span>
          </div>
          <div class="rows">
            <div class="row">
              <label class="field"><span>批大小</span><input id="batch_size" class="w-xs num" placeholder="3"></label>
              <label class="field"><span>并发</span><input id="workers" class="w-xs num" placeholder="2"><em class="key-hint" id="workers-hint"></em></label>
              <label class="field"><span>翻页等待</span><input id="wait_ms" class="w-sm num" placeholder="1000"><em>ms</em></label>
              <label class="field"><span>最大 token</span><input id="max_tokens" class="w-sm num" placeholder="4096"></label>
            </div>
            <div class="row switches">
              <label class="switch"><input type="checkbox" id="opt-md" checked><span class="track"><span class="knob"></span></span><span>生成 Markdown</span></label>
              <label class="switch"><input type="checkbox" id="opt-index" checked><span class="track"><span class="knob"></span></span><span>生成 index.json</span></label>
            </div>
            <div class="row switches">
              <label class="switch"><input type="checkbox" id="opt-preflight" checked><span class="track"><span class="knob"></span></span><span>开始前预检题号</span></label>
              <label class="switch"><input type="checkbox" id="opt-check-model" checked><span class="track"><span class="knob"></span></span><span>运行前测试模型</span></label>
            </div>
          </div>
        </section>

        <section class="card" id="card-entries">
          <div class="card-head">
            <h2>入口</h2><span class="hint">点一下打开独立设置窗口（与主页面实时同步）</span>
          </div>
          <div class="entries">
            <button type="button" class="entry" id="entry-action" data-panel="action">
              <span class="entry-icon">翻</span>
              <span class="entry-main"><span class="entry-name">翻页动作</span><span class="entry-note" id="note-action">读取中…</span></span>
              <span class="entry-go">打开 ›</span>
            </button>
            <button type="button" class="entry" id="entry-modules" data-panel="modules">
              <span class="entry-icon">提</span>
              <span class="entry-main"><span class="entry-name">提取模块</span><span class="entry-note" id="note-modules">读取中…</span></span>
              <span class="entry-go">打开 ›</span>
            </button>
            <button type="button" class="entry" id="entry-model" data-panel="model">
              <span class="entry-icon">模</span>
              <span class="entry-main"><span class="entry-name">模型服务</span><span class="entry-note" id="note-model">读取中…</span></span>
              <span class="entry-go">打开 ›</span>
            </button>
            <button type="button" class="entry" id="entry-tuner" data-panel="tuner">
              <span class="entry-icon">屏</span>
              <span class="entry-main"><span class="entry-name">屏幕调节</span><span class="entry-note" id="note-tuner">读取中…</span></span>
              <span class="entry-go">打开 ›</span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <section class="card log-card">
      <div class="card-head">
        <h2>日志</h2>
        <span class="spacer"></span>
        <button class="btn small ghost" id="btn-open-dir">打开输出目录</button>
        <button class="btn small ghost" id="btn-clear-log">清空</button>
      </div>
      <div class="log-wrap">
        <canvas class="horse" id="horse" aria-hidden="true"></canvas>
        <div class="log" id="log"></div>
      </div>
    </section>
  </div>

  <!-- 隐藏载体：四个设置窗口改完会回填到这里，开始提取时按这套值跑 -->
  <div class="hidden">
    <input id="model" type="hidden" value="">
    <input id="base_url" type="hidden" value="">
    <input id="page_action" type="hidden" value="auto">
    <input id="next_action" type="hidden" value="">
    <input id="action_tap_x" type="hidden" value="">
    <input id="action_tap_y" type="hidden" value="">
    <input id="action_tap_ms" type="hidden" value="80">
    <input id="swipe_x1" type="hidden" value="">
    <input id="swipe_y1" type="hidden" value="">
    <input id="swipe_x2" type="hidden" value="">
    <input id="swipe_y2" type="hidden" value="">
    <input id="swipe_duration" type="hidden" value="">
    <input id="swipe_retries" type="hidden" value="">
    <input id="swipe_retry_wait" type="hidden" value="">
    <input id="swipe_reference" type="hidden" value="">
    <input id="extract_modules" type="hidden" value="">
    <input id="output_fields" type="hidden" value="">
    <input id="display_scale" type="hidden" value="1">
    <input id="display_width_scale" type="hidden" value="1">
    <input id="display_density" type="hidden" value="0">
    <!-- 界面上不暴露：留一个复选框只是别把命令行设的 display_scaling 悄悄改回 auto -->
    <input type="checkbox" id="opt-display-scaling" class="hidden">
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="modal-title">提示</h3>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <button class="btn" id="modal-no">取消</button>
        <button class="btn primary" id="modal-yes">继续</button>
      </div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="horse.js"></script>
  <script src="app.js"></script>
</body>
</html>
